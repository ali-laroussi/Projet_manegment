# ==================== SERVER ====================

server.port=8080
server.servlet.context-path=/api

# ==================== DATABASE (MYSQL / XAMPP) ====================

spring.datasource.url=jdbc:mysql://localhost:3306/project_management_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==================== SQL INIT ====================

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==================== LOGGING ====================

logging.level.root=INFO
logging.level.com.projectmanagement=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==================== JWT ====================

jwt.secret=your_super_secret_key_change_this_in_production_environment
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==================== APP ====================

app.name=Project Management Application
app.version=1.0.0

# ==================== CORS ====================

cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
